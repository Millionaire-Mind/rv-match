# Reverse proxy in front of the `app` container. This is the one place in
# the whole deployment that's allowed to set X-Real-IP - it always uses
# $remote_addr, nginx's own view of the TCP peer that connected to it,
# never a client-supplied header, so it can't be spoofed by a request. The
# app (src/server/security/client-ip.ts) trusts X-Real-IP for exactly this
# reason and reads no other IP-ish header.
#
# If you put another load balancer in front of this nginx (e.g. a cloud
# LB), make sure *that* layer is what terminates the real client
# connection and that nginx's $remote_addr reflects it - otherwise adjust
# this file to read the LB's own trusted header instead of $remote_addr.
server {
    listen 80;
    server_name _;

    client_max_body_size 300m; # matches serverActions.bodySizeLimit in next.config.ts

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
